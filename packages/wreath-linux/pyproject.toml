[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wreath-linux"
version = "0.3.0"
description = "Wreath's native Linux io_uring reactor"
requires-python = "==3.14.*"
license = "MPL-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/alexogeny/wreath"
Documentation = "https://alexogeny.github.io/wreath/"
Source = "https://github.com/alexogeny/wreath"

[tool.cibuildwheel]
build = "cp314-*"
skip = ["*-musllinux_*", "*_i686"]
before-build = "python -c \"import shutil; shutil.rmtree('build', ignore_errors=True)\""
before-test = "pip install --no-index --find-links {package}/wheel-deps wreath==0.3.0"
test-command = "python {package}/wheel_smoke.py --reactor"
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"

[tool.cibuildwheel.linux]
before-all = "dnf install -y perl-core make gcc curl && WREATH_OPENSSL_LICENSE_DIR={package}/licenses bash {package}/build_openssl_wheel_dep.sh"
environment = { CFLAGS = "-I/opt/wreath-openssl/include", LDFLAGS = "-L/opt/wreath-openssl/lib", LD_LIBRARY_PATH = "/opt/wreath-openssl/lib" }
