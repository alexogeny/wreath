[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wreath"
version = "0.1.0a3"
description = "A Python 3.14-first, dependency-free ASGI framework core"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Wreath contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

# PyPI renders these as the project's sidebar links. Without them the listing
# has no way back to the source or the documentation, and every relative link
# in the README resolves against pypi.org instead. The README uses absolute
# URLs for the same reason.
[project.urls]
Homepage = "https://github.com/alexogeny/wreath"
Documentation = "https://alexogeny.github.io/wreath/"
Source = "https://github.com/alexogeny/wreath"
Issues = "https://github.com/alexogeny/wreath/issues"
Changelog = "https://alexogeny.github.io/wreath/release_notes/index.html"

[dependency-groups]
dev = [
  # Generating the throwaway self-signed certificates the TLS and HTTP/3 tests
  # need. Declared here deliberately: it used to arrive only as a transitive of
  # the benchmark group, so any `uv sync` without that group pruned it and 21
  # HTTP/3 tests plus the TLS transport tests skipped themselves silently.
  "cryptography>=44",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  # Opt-in, never in addopts: the default suite is ~3.5s and worker startup
  # eats the whole gain there. It pays on the full run (-m ''), where the
  # network and performance tests are included. See AGENTS.md.
  "pytest-xdist>=3.6",
  "ruff>=0.12",
  # `[build-system] requires` only populates uv's isolated build environment,
  # never this venv. Rebuilding the extensions in place
  # (`python setup.py build_ext --inplace`, `tools/sanitizers/build_*.py`)
  # imports setuptools from the venv, so it has to be a dev dependency too --
  # otherwise a sync prunes it and the next build fails with
  # ModuleNotFoundError while the stale .so stays in place.
  "setuptools>=77",
  "ty",
]
benchmark = [
  "alembic>=1.16",
  # Bench-only competitor for bench_cedar: the official Rust Cedar engine via
  # its Python bindings. Never a runtime dependency — Wreath's own engine is
  # built in; this exists so the benchmark can verify agreement and compare
  # per-call cost against the reference implementation.
  "cedarpy>=4.1",
  # Sanic's HTTP/3 backend. Sanic serves h1 and h3 and never implemented h2, so
  # without this the protocol comparison has no h3 competitor at all -- and
  # Sanic degrades to HTTP/1.1 silently rather than refusing to start.
  "aioquic>=1.2",
  "asyncpg>=0.30",
  "blacksheep>=2.2",
  "django>=5.2",
  "fastapi>=0.116",
  "flask>=3.1",
  # Granian, the Rust ASGI/RSGI server, hosts the `blacksheep-granian` arm. The
  # matrix otherwise holds the server fixed at Uvicorn so the framework is the
  # only variable; this arm deliberately varies the server instead, against the
  # same BlackSheep app, so the two are a controlled pair.
  "granian>=2.7",
  # No fastwsgi: 0.0.9 is the latest release and it cannot be imported on this
  # interpreter. See the candidates table in benchmarks/README.md.
  "litestar>=2.17",
  "pydantic>=2.11",
  "sanic>=25.3",
  "starlette>=0.47",
  # The logging competitor for benchmarks/bench_logging.py, exactly like
  # pydantic: a benchmark dependency, never importable from wreath. The bench
  # skips its arms and records the skip when this group is not synced.
  "structlog>=25.1",
  "uvicorn[standard]>=0.35",
  # Competitor ORMs for benchmarks/postgres/bench_orm_competitors.py. Benchmark
  # dependencies only, exactly like pydantic: none of these may be imported by
  # wreath, and SQLAlchemy in particular is a competitor here, never an
  # integration -- see AGENTS.md.
  "peewee>=3.17",
  "psycopg2-binary>=2.9",
  "sqlalchemy[asyncio]>=2.0",
  "sqlmodel>=0.0.22",
  "tortoise-orm>=0.21",
]

# Panther, kept out of `benchmark` on purpose. It pins `httptools~=0.7.1`, and
# `uvicorn[standard]>=0.51` needs `httptools>=0.8`, so resolving the two together
# drags Uvicorn *and its C HTTP parser* down for every Uvicorn-hosted arm --
# a competitor silently moving the baseline the whole matrix is compared against,
# and invalidating every result already recorded under the current one.
#
# The pin is metadata only: Panther imports no httptools itself and runs fine
# against 0.8. So install it without letting it re-resolve the environment:
#
#     uv pip install --no-deps panther
#     uv run wreath-bench --framework panther ...
#
# It is excluded from DEFAULT_FRAMEWORKS (see benchmarks/scenarios.py) so a bare
# run never reaches for it. Syncing this group *instead* of `--no-deps` will
# perform the downgrade described above; if you do that, label the results.
benchmark-panther = [
  "panther>=5.5",
]

[project.scripts]
wreath = "wreath.cli:main"
# Maintenance commands for Wreath's C; see src/wreath/_devtools/.
wreath-native-lint = "wreath._devtools.native_lint:main"
wreath-native-boundary-lint = "wreath._devtools.native_boundary_lint:main"
wreath-native-error-lint = "wreath._devtools.native_error_lint:main"
wreath-native-gil-lint = "wreath._devtools.native_gil_lint:main"
wreath-native-gil-status = "wreath._devtools.native_gil_status:main"
wreath-native-memory-lint = "wreath._devtools.native_memory_lint:main"
wreath-native-profile = "wreath._devtools.native_profile:main"
wreath-complexity-probe = "wreath._devtools.complexity_probe:main"
# Drives an ASan/UBSan build and attributes what it finds; see _devtools/sanitize.py.
wreath-sanitize = "wreath._devtools.sanitize:main"
# Checks that the agent-facing maps still describe the repository.
wreath-map-lint = "wreath._devtools.map_lint:main"
# Fails when a compiled extension is older than the sources it is built from.
# Not in the gate yet: `_http3` is genuinely stale and cannot be rebuilt here.
wreath-build-lint = "wreath._devtools.build_lint:main"
# Fails when the roadmap claims a surface is absent and the symbol resolves.
# Not in the gate yet: the one in-scope row still needs its `absent:` marker.
wreath-roadmap-lint = "wreath._devtools.roadmap_lint:main"
# Fails when a query's parameter type would be inferred as something the driver
# cannot encode -- the shape that works once and raises on every call after.
wreath-sql-lint = "wreath._devtools.sql_lint:main"
# Checks (--update regenerates) the pinned `wreath port` emitter output.
wreath-port-golden = "wreath._devtools.port_golden:main"
# Reports function bodies sharing a structure. A report, not a gate.
wreath-dup-scan = "wreath._devtools.dup_scan:main"
wreath-request-trace = "wreath._devtools.request_trace:main"
wreath-tape-decomp = "wreath._devtools.tape_decomp:main"
wreath-decomp = "wreath._devtools.decomp:main"
# Task runners. Each installs the dependency group it needs with
# `uv sync --inexact`, so switching jobs cannot uninstall the last one.
wreath-check = "wreath._devtools.tasks:check"
wreath-docs = "wreath._devtools.tasks:docs"
wreath-bench = "wreath._devtools.tasks:bench"
# Quiet the machine for benchmarking, reversibly. Separate from `wreath-bench`
# so `--restore` is reachable from a fresh shell after a crash.
wreath-bench-quiet = "wreath._devtools.quiet:main"
# Renders benchmark result JSON to a local HTML file; see benchmarks/README.md.
wreath-bench-report = "wreath._devtools.bench_report:main"

[tool.uv]
# `uv sync` reconciles the venv to exactly the selected groups, removing
# everything else. Naming dev here keeps it installed for every sync and for
# `uv run --group docs`/`--group benchmark`, so working on one group cannot
# quietly uninstall the toolchain the tests and native builds need.
default-groups = ["dev"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m 'not fuzz and not performance and not network and not thesis'"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "fuzz: expensive deterministic or randomized fuzz coverage",
  "performance: repeatable performance-ordering checks",
  "network: tests using real sockets, TLS, or external clients",
  # `database` is deliberately NOT in the default deselect list above. A test
  # that needs only a PostgreSQL DSN used to carry `network`, so it was excluded
  # by default alongside tests that need a live socket -- and therefore never ran
  # even on a machine where a database *was* available. That is how the
  # DSN-gated suites went a long time without running once, and when they finally
  # did they found a defect in a default code path. These are gated by a skipif
  # on WREATH_TEST_POSTGRES_DSN, so they skip cleanly without one and run
  # whenever there is a database to run against.
  "database: tests needing a PostgreSQL DSN, but no listening socket of ours",
  "thesis: intentionally red deterministic architecture checklist",
]

[tool.ty.src]
include = ["src"]
exclude = [".sanitizers"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Generated sanitizer build roots hold copies of the sources they were built
# from; linting them reports drift in artifacts rather than in the tree. The
# nghttp2 tree is a locally built h2load (benchmarks/README.md) and is upstream's
# source, not ours. `tests/port/corpus` is the same idea: it is *input text* for
# the `wreath port` codemod -- deliberately idiomatic FastAPI/Pydantic/SQLModel
# applications that are read as source and never imported (see
# tests/port/conftest.py, which excludes them from pytest collection for the
# same reason). Linting them reports style findings in someone else's dialect,
# and "fixing" one would delete the pattern the analyzer exists to recognize:
# UP045 would rewrite the `Optional[X]` that tests/port/golden asserts on.
extend-exclude = [".sanitizers", "nghttp2", "tests/port/corpus"]

[tool.ruff.lint]
# BLE enforces AGENTS.md's "a broad `except` is the exception, not the rule":
# guard the precondition, else catch the specific type, else catch broadly with a
# counter and a waiver carrying a written reason. It is on repo-wide rather than
# scoped to `src` -- `tests` and `benchmarks` cost eleven sites between them, and
# a test that swallows around the code under test is a test that cannot fail.
# Enabled after the fact: 49 `# noqa: BLE001` waivers were already written here
# against a rule that had never run, which is its own kind of check with nothing
# to check.
#
# RUF100 closes that class permanently: it fails on a `noqa` waiving a rule this
# ruleset does not enforce, so a waiver can no longer be written against nothing.
# It is on repo-wide with no per-file exemption, because when it was first
# measured the 31 genuinely dead waivers were *all* in `tests` and `benchmarks` --
# the two trees an exemption would have covered.
#
# S102 and S310 are selected individually rather than by taking all of `S`. Both
# are tiny here (7 `exec` sites, 4 URL-open sites) and both already carried
# waiver prose explaining why the call is safe; enabling them turns that prose
# from decoration into a requirement, and makes an unexplained `exec` fail the
# gate. The rest of `S` is not selected: it has not been triaged, and a rule set
# nobody has read is how a gate acquires a blanket ignore.
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE", "RUF100", "S102", "S310"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in parameter defaults is the dependency-injection marker.
extend-immutable-calls = ["wreath.binding.Depends", "Depends"]

[tool.ruff.lint.per-file-ignores]
# The `wreath port` rule catalog is a data table, not code: one line per rule,
# `rule_id -> (construct, category, tag, message)`, where the message is the
# prose a reviewer reads in the report. Rule ids appear in that report so a
# reviewer can grep a worklist, which only works while a rule stays on one line
# -- wrapping the 50 entries to fit would cost the property the file exists for.
# Scoped deliberately: E501 only, and only here.
"src/wreath/_port/rules.py" = ["E501"]
"benchmarks/apps.py" = ["E402"]
"benchmarks/lifecycle_apps.py" = ["E402"]
"benchmarks/lifecycle.py" = ["ASYNC220", "ASYNC240"]
"benchmarks/run.py" = ["ASYNC220", "ASYNC240"]
