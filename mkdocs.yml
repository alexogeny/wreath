site_name: Wreath Documentation
site_description: Guides, cookbook, and API reference for the Wreath ASGI framework and native server
site_url: https://alexogeny.github.io/wreath/
repo_name: wreath
repo_url: https://github.com/alexogeny/wreath
strict: true
# Per-version release notes are generated (docs/release_notes/<version>.md) and
# linked from release_notes/index.md rather than listed individually in the nav;
# exempt them from the strict "not in nav" check.
not_in_nav: |
  /release_notes/[0-9]*.md
# Plans and ADRs are hidden (and gitignored) until they stabilise: exclude them
# from the build so strict mode does not flag them as missing from the nav.
exclude_docs: |
  plans/
  decisions/
  agents/*.json
  agents/*.md
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
