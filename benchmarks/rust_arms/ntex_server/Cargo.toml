[package]
name = "wreath-bench-ntex"
version = "0.1.0"
edition = "2021"
publish = false
description = "ntex reference arm for the Wreath framework matrix. Benchmark only."

[[bin]]
name = "wreath-bench-ntex"
path = "src/main.rs"

[dependencies]
bench_common = { path = "../bench_common" }
ntex = { version = "2", features = ["tokio"] }
serde_json = "1"
