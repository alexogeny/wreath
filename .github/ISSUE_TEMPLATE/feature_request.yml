name: Feature request
description: Something wreath should do that it does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Use whatever tools you like to think this through** — the framing
        below is what a maintainer needs, not a test of how you wrote it. Leave
        tool attribution out of the body; it is not something anyone can act on.

        Two things worth doing first, because they answer most requests faster
        than an issue can:

        - `wreath capabilities <the package you would otherwise install>` —
          wreath is wide on purpose, and the answer is often a module you
          already have.
        - [`docs/reference/roadmap.md`](../blob/main/docs/reference/roadmap.md) —
          which records what is deliberately *not* shipped, and why. If your
          request is there, say what changed rather than opening a duplicate.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What are you trying to do, and where does wreath stop you? Describe the
        situation rather than the feature — the best answer is often a different
        shape from the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, the dependency you reached for, or the code you wrote by hand.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: Optional. A sketch of the API, if you have one in mind.
      render: python

  - type: checkboxes
    id: confirms
    attributes:
      label: Before filing
      options:
        - label: I ran `wreath capabilities` and this is not already shipped under another name.
          required: true
        - label: I checked the roadmap for whether this is deliberately unshipped.
          required: true
        - label: I have read this request and can answer follow-up questions about it.
          required: true
