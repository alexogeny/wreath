name: ci

# One compiled environment serves lint, docs, tests, changed-control replay and
# the Pages artifact. Scheduled sanitizer campaigns remain in fuzz.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede an in-progress run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This standard-library-only PR gate needs neither uv nor compiled extensions.
  hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own commits, which a shallow clone does not have. Without
          # this the range below resolves to nothing and the check passes by
          # examining zero commits — the failure mode where a green tick means
          # "did not look".
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Tracked paths
        run: python src/wreath/_devtools/hygiene.py --paths

      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Refuse to pass on an empty range rather than reporting clean over
          # nothing, which is indistinguishable from a pass.
          count="$(git rev-list --count "$BASE..$HEAD")"
          echo "checking $count commit(s)"
          [ "$count" -gt 0 ] || { echo "::error::empty commit range"; exit 1; }
          python src/wreath/_devtools/hygiene.py --range "$BASE..$HEAD"

      - name: Pull request title and body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Through the environment and a file, never interpolated into the
          # script: a PR body is attacker-controlled text, and an expression
          # interpolated into `run:` is substituted before the shell sees it.
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.md"
          python src/wreath/_devtools/hygiene.py --message-file "$RUNNER_TEMP/pr.md"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Restore the latest scheduled fuzz corpus
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: .wreath/fuzz/corpus
          key: Linux-wreath-fuzz-v1-pr-${{ github.run_id }}
          restore-keys: |
            Linux-wreath-fuzz-v1-
      - name: Sync once with Linux development capabilities
        # Passing the capability into the editable-wheel build avoids compiling
        # every base extension again in a subsequent build_ext invocation.
        run: WREATH_BUILD_LINUX=1 uv sync --frozen

      # Cheapest first, so a formatting slip fails at ~30s rather than after the
      # 78s suite. Every step below is `--no-sync`: the environment is already
      # exactly what the lockfile describes, and letting `uv run` re-resolve it
      # per step is the cost this job exists to stop paying.
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Ty
        run: uv run --no-sync ty check
      - name: Strict docs build
        run: uv run --no-sync wreath docs check

      - name: Fast tests and pull-request replay
        # The PR run uses this one baseline both for ordinary correctness and
        # changed-control reachability. Python corpus replay still exercises the
        # production native extensions; sanitizer harnesses run on the schedule.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            uv run --no-sync wreath test --mutant off --no-history
            exit 0
          fi

          replay=(
            --fuzz on
            --fuzz-backend python
            --fuzz-replay-only
            --fuzz-cases 256
            --fuzz-budget 30
            --fuzz-target graphql-parser
            --fuzz-target h2-frames
            --fuzz-target http-replay-codec
            --fuzz-target http1-parser
            --fuzz-target multipart-parser
            --fuzz-target xml-parser
            --fuzz-corpus .wreath/fuzz/corpus
            --fuzz-artifacts .wreath/fuzz/artifacts
            --no-history
            --report fuzz-pr-report.json
          )
          if ! git diff --quiet "$BASE_SHA"...HEAD -- \
            'src/wreath/*.py' 'src/wreath/**/*.py'; then
            set +e
            uv run --no-sync wreath test \
              --mutant changed --mutant-changed "$BASE_SHA" \
              "${replay[@]}" 2>&1 | tee changed-fuzz.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 2 ] || \
              ! grep -Fq 'matched no mutations' changed-fuzz.log; then
              exit "$status"
            fi
          fi
          uv run --no-sync wreath test --mutant off "${replay[@]}"

      - name: Upload pull-request replay report and findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-results-pr-${{ github.run_id }}
          path: |
            fuzz-pr-report.json
            .wreath/fuzz/artifacts
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: site-${{ github.run_id }}
          path: site
          if-no-files-found: error
          retention-days: 1
