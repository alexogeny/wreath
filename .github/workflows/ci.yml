name: ci

# Pull-request and main validation: the fast test suite and a strict docs
# build. Benchmarks are not run here — they live in benchmarks/, are never
# collected by pytest (testpaths = ["tests"]), and are regenerated on the
# maintainer's host, not in CI.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede an in-progress run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (default 'dev' group; builds the native extension)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Ty
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (default 'dev' group; builds the native extension)
        run: uv sync --frozen
      - name: Fast tests
        # Default marks exclude fuzz/performance/network. The suite is ~14,500
        # tests, not the ~3.5 seconds this step was written for, so it runs
        # parallel: `wreath test` picks min(8, cpu_count) workers, which is 4 on
        # a public-repo ubuntu-latest. Serial pytest took 119s here on Aug 2 and
        # 162s on Aug 6, on one of the runner's four cores.
        #
        # `--mutant off` is load-bearing. The default is a 192-control mutation
        # sample with a 50-second post-suite ceiling plus live mutant children
        # competing for cores; that belongs on a maintainer's machine, not in
        # front of a pull request. `--no-history` keeps the run from writing
        # timing history into a workspace that is discarded — until something
        # caches `.wreath/test-history.json`, nothing reads it, and without it
        # the history-weighted scheduler stays unregistered and this is xdist
        # `--dist loadgroup` with a timing report on top.
        run: uv run wreath test --mutant off --no-history

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install wreath
        # No docs group exists: wreath's own generator builds the site. The
        # project is installed because the `:::` reference directive imports
        # the modules it documents.
        run: uv sync --frozen
      - name: Build site (strict)
        # Fails on an orphan page, a dead internal link, or a broken anchor.
        run: uv run --no-sync wreath docs check
