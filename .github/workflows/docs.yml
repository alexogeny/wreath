name: docs

# Build the MkDocs site and deploy it to GitHub Pages through the `github-pages`
# environment. mkdocstrings reads docstrings statically from src/, so the native
# C extension does not need to be built here — the docs group is enough.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

# Least privilege: only the deploy job's OIDC token and Pages write are granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let an in-progress deploy finish rather than
# cancelling it, but supersede queued builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install docs dependencies
        # Only the docs group; skip building/installing the C-extension project.
        run: uv sync --frozen --only-group docs --no-install-project
      - name: Build site (strict)
        run: uv run --no-sync mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
