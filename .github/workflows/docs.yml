name: docs

# Build the documentation site with wreath's own static-site generator and
# deploy it to GitHub Pages through the `github-pages` environment.
#
# There is no docs dependency group and no third-party toolchain: `wreath docs`
# is part of the framework, so the only thing to install is wreath itself. The
# project *is* installed here (unlike the old mkdocstrings build, which read
# docstrings statically) because the `:::` reference directive imports the
# modules it documents.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/**
      - wreath_docs.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

# Least privilege: only the deploy job's OIDC token and Pages write are granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let an in-progress deploy finish rather than
# cancelling it, but supersede queued builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install wreath
        run: uv sync --frozen
      - name: Build site (strict)
        # `check` fails on an orphan page, a dead internal link, or a broken
        # anchor -- the same gate contributors run locally.
        #
        # The token is for the header's star and fork counts, read once here and
        # baked into the HTML (`_docs/repo.py`). Anonymous GitHub API calls are
        # limited per source address, which on a shared runner is a budget split
        # with every other project on that machine; with the token the limit is
        # this repository's own, so the counts don't come and go between deploys.
        # No token, no network, or an error: the link renders without counts.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync wreath docs check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
