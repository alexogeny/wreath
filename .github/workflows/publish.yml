name: publish

# Cut a versioned release when a commit on main bumps the version in
# pyproject.toml.
#
#   1. detect  - Is the pyproject version a valid PEP 440 version, greater than
#                the last published one, and does it have release notes?
#                Emits `bumped` + `version`.
#
#                The baseline is `github.event.before`, not `HEAD~1`. A push
#                carrying several commits that bumps the version in any but the
#                last leaves HEAD~1 already holding the new version, so the diff
#                is empty and no release is cut -- with a green tick, because
#                "no bump" is a success.
#
#                When no release is cut, the reason is written to the run
#                summary. A skipped `release` job otherwise looks identical to
#                a broken one.
#   2. verify  - Lint, types, the test suite, and a strict docs build, against
#                the exact commit being released. `release` and `pypi` both need
#                it, so a red suite cannot cut a tag or reach the index.
#
#                Run *here* rather than depended on from `ci`. `ci` and
#                `publish` are separate workflows triggered by the same push, so
#                a `workflow_run` link would publish on whatever `ci` last
#                reported -- including a run of a different commit, or none at
#                all when `ci`'s own filters skipped it. A job in this workflow
#                is unambiguously this commit.
#   3. release - (environment: publish) Guard against a duplicate tag, require a
#                docs/release_notes/<version>.md file, then cut the
#                `release/vX.Y.Z` branch from the release commit, push the
#                `vX.Y.Z` tag, and create the GitHub Release from the notes.
#   4. wheels  - Build and smoke-test the portable wheel on native Linux,
#                macOS and Windows runners. Then build the Linux io_uring and
#                HTTP/3 companion wheels selected by extras. `release` needs all
#                three jobs: a wheel that will not run must stop the tag, not
#                leave one pointing at a release nobody can install.
#   5. pypi-*  - Publish one distribution per Trusted Publishing identity. The
#                companion projects go first; the base project becomes visible
#                only after both extras are installable.
#
# Configure all three GitHub environments with the same reviewer/branch policy,
# then register these exact PyPI Trusted Publishers (owner `alexogeny`, repository
# `wreath`, workflow `publish.yml`):
#
#   wreath        -> environment `publish`
#   wreath-linux  -> environment `publish-linux`
#   wreath-http3  -> environment `publish-http3`
#
# The distinct environments are required while the companion projects are
# pending. PyPI refuses a second pending project with the same owner/repository/
# workflow/environment identity because an incoming OIDC token would not name
# which pending project it is meant to create.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:
    inputs:
      force:
        description: Release even if no version bump is detected
        type: boolean
        default: false

# Read-only by default; the jobs that need to write request it explicitly.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not `2`. The baseline is the commit this push STARTED
          # from (`github.event.before`), which can be many commits back, and a
          # shallow clone cannot read pyproject.toml out of it.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the version parser
        # `packaging` is the reference PEP 440 implementation. This check used a
        # semver regex and `sort -V`, and the index this guards speaks neither:
        # `0.1.0a1` is a legal Python version the regex rejected outright, and
        # `sort -V` orders `0.1.0 < 0.1.0-alpha` where PEP 440 -- and PyPI --
        # order it the other way. Both errors point at publishing the wrong
        # thing, so the guard now uses the same rules as the index.
        run: python -m pip install --quiet packaging
      - id: check
        env:
          FORCED: ${{ inputs.force }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Reads stdin, so the same helper works on a file and on `git show`.
          extract() { grep -m1 -E '^version[[:space:]]*=' \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'; }

          version="$(extract < pyproject.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Emitted here because this is the only job with `packaging`, and a
          # GitHub release that does not say it is a prerelease takes the
          # "Latest release" badge from whatever stable version preceded it.
          prerelease="$(python -c '
          import sys
          from packaging.version import InvalidVersion, Version
          try:
              print(str(Version(sys.argv[1]).is_prerelease).lower())
          except InvalidVersion:
              print("false")
          ' "$version")"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          if ! python -c '
          import sys
          from packaging.version import InvalidVersion, Version
          try:
              Version(sys.argv[1])
          except InvalidVersion as error:
              sys.exit(str(error))
          ' "$version"; then
            echo "::error::version '$version' is not a valid PEP 440 version"
            exit 1
          fi

          # The baseline must be where the push started, NOT HEAD~1. A push of
          # several commits that bumps the version in any but the last leaves
          # HEAD~1 already carrying the new version, so the diff comes out empty
          # and the release never happens -- silently, because "no bump" is a
          # success.
          #
          # `before` is all-zeros when the branch is newly created, and absent
          # entirely on workflow_dispatch. Both fall back to HEAD~1, which is
          # deliberately the conservative reading: treating "no previous state"
          # as a bump would cut a release the first time main is ever pushed.
          zero="0000000000000000000000000000000000000000"
          base=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif git cat-file -e 'HEAD~1^{commit}' 2>/dev/null; then
            base="HEAD~1"   # workflow_dispatch carries no `before`
          fi
          prev=""
          if [ -n "$base" ]; then
            prev="$(git show "$base:pyproject.toml" 2>/dev/null | extract || true)"
          fi

          note() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          if [ "${FORCED:-false}" = "true" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            note "Forced release of **$version** (no version diff required)."
            exit 0
          fi

          if [ "$version" = "$prev" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            # Say so loudly. A skipped `release` under a green tick is
            # indistinguishable from a broken one without reading the log, and
            # that ambiguity has already cost one round of investigation.
            note "### No release cut"
            note ""
            note "\`pyproject.toml\` is still at **$version**, unchanged since \`${base:-<none>}\`,"
            note "so \`release\` and \`pypi\` were skipped. **This is the designed outcome, not a"
            note "failure.** Bump the version (and add its release notes) to cut a release."
            exit 0
          fi

          # Compare against the last *published* version, not against whatever
          # pyproject said a commit ago. Those differ exactly once, and it is
          # now: pyproject carried `0.1.0` from the first commit without a
          # release ever being cut, so the first prerelease of it -- `0.1.0a1`,
          # which PEP 440 correctly orders BELOW `0.1.0` -- would be rejected as
          # a downgrade from a version nobody can install. You cannot go
          # backwards from something that was never published.
          released="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          if [ -z "$released" ]; then
            note "No \`v*\` tag exists, so **$version** is the first release; the"
            note "increase check is skipped (no published version to regress from)."
          elif ! python -c '
          import sys
          from packaging.version import Version
          sys.exit(0 if Version(sys.argv[2]) > Version(sys.argv[1]) else 1)
          ' "$released" "$version"; then
            echo "::error::version '$version' does not increase last released '$released'"
            exit 1
          fi

          # Checked here as well as in `release`, because `release` sits behind
          # the `publish` environment: leaving this as the only check means a
          # missing notes file is reported only after whatever approval that
          # gate requires, which is the slowest possible moment to learn it.
          notes="docs/release_notes/$version.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes -- run the release-notes skill before bumping the version"
            exit 1
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          note "Version bump: **${prev:-<none>} -> $version**. Cutting a release."

  verify:
    # The gate that was missing. `publish` triggers on a push to main touching
    # pyproject.toml and used to depend on nothing, so a red suite still cut a
    # tag and pushed to PyPI -- and PyPI does not accept a re-upload of a
    # version, so a bad release is permanent.
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (default 'dev' group; builds the native extension)
        run: uv sync --frozen
      - name: Build Linux development capabilities in place
        # The published base wheel deliberately excludes io_uring. An editable
        # checkout cannot be overlaid by the companion wheel's `wreath/`
        # directory, so source development uses the explicit build switch.
        run: WREATH_BUILD_LINUX=1 uv run python setup.py build_ext --inplace
      - name: Ruff
        run: uv run ruff check .
      - name: Ty
        run: uv run ty check
      - name: Tests
        # `wreath test`, not a bare `pytest`: the marker deselection lives in
        # `pyproject.toml`'s `addopts`, so both select the same tests, but the
        # runner picks min(8, cpu_count) workers where `pytest` alone runs one.
        # `--mutant off --no-history` match `ci`'s `checks` job -- the mutation
        # sample and the timing history belong on a maintainer's machine, not
        # in front of a release.
        run: uv run --no-sync wreath test --mutant off --no-history
      - name: Build site (strict)
        run: uv run --no-sync wreath docs check

  wheels:
    # The base distribution is the portable native implementation. Each wheel
    # is compiled and served on the target OS before the release tag exists.
    needs: [detect, verify]
    if: needs.detect.outputs.bumped == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: windows-2025
            platform: windows
            arch: AMD64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Everything else -- interpreter, image, skips, and the import smoke test
      # each wheel must pass -- is `[tool.cibuildwheel]` in pyproject.toml, so it
      # is the same locally as it is here.
      - uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-base-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  linux-wheels:
    # `wreath[linux]`: only the io_uring extension. It overlays the installed
    # base wheel's `wreath._native` directory; the smoke test proves the two
    # separately built distributions import and serve together.
    needs: [detect, verify, wheels]
    if: needs.detect.outputs.bumped == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-base-linux-${{ matrix.arch }}
          path: wheel-deps
      - name: Stage a self-contained companion build
        run: >-
          python tools/stage_companion_wheel.py linux
          packages/.wheel-staging/wreath-linux-wheel
      - uses: pypa/cibuildwheel@v3.2.0
        with:
          package-dir: packages/.wheel-staging/wreath-linux-wheel
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  http3-wheels:
    # `wreath[h3]` / `wreath[http3]`. The pinned MIT/Apache-licensed QUIC/TLS
    # stack is built inside manylinux and bundled by auditwheel, so opting in
    # does not require system packages on the deployment host.
    needs: [detect, verify, wheels]
    if: needs.detect.outputs.bumped == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-base-linux-${{ matrix.arch }}
          path: wheel-deps
      - name: Stage a self-contained companion build
        run: >-
          python tools/stage_companion_wheel.py http3
          packages/.wheel-staging/wreath-http3-wheel
      - uses: pypa/cibuildwheel@v3.2.0
        with:
          package-dir: packages/.wheel-staging/wreath-http3-wheel
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-http3-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    needs: [detect, verify, wheels, linux-wheels, http3-wheels]
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write # push the release branch/tag and create the release
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the tag and branch are complete

      - name: Guard against a tag that means something else
        run: |
          set -euo pipefail
          # A tag at a DIFFERENT commit means the version was reused, which is
          # what this guard is for. A tag at THIS commit means an earlier run of
          # this same release got partway and failed -- refusing that leaves the
          # release permanently unfinishable, because the tag it already pushed
          # is what blocks the retry. Ask for a re-run, not a version bump.
          tag="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            exit 0
          fi
          existing="$(git rev-list -n1 "$tag")"
          if [ "$existing" = "$GITHUB_SHA" ]; then
            echo "Tag $tag already at this commit; resuming a partial release."
            exit 0
          fi
          # The tag names a different commit. Whether that is a reused version or
          # an unfinished attempt is decided by whether anything ever consumed
          # it: `pypi` runs only after this job succeeds, so no GitHub Release
          # means nothing was published either.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already released, at $existing; bump the version"
            exit 1
          fi
          # Nothing consumed it, so the tag is a leftover from a run that failed
          # after pushing it -- which is exactly what happens when the failure is
          # in CI and the fix is another commit. Moving it is correct: the sdist
          # is built from HEAD, so a tag left behind would name a tree the
          # published artifact does not match.
          echo "::warning::$tag exists at $existing but was never released; moving it to $GITHUB_SHA"
          echo "RETAG=1" >> "$GITHUB_ENV"

      - name: Require release notes
        run: |
          set -euo pipefail
          notes="docs/release_notes/$VERSION.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes — run the release-notes skill to generate it before bumping the version"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release branch and tag
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          tag="v$VERSION"
          # --force on the branch and a skip on the tag: re-running must reach
          # the same end state rather than failing on what the last run already
          # did. checkout fetches tags at depth 0, so a tag present locally is a
          # tag present on the remote.
          git branch -f "$branch" HEAD
          git push --force origin "$branch"
          if [ "${RETAG:-0}" = "1" ]; then
            git tag -f -a "$tag" -m "wreath v$VERSION"
            git push --force origin "refs/tags/$tag"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already pushed at this commit; leaving it."
          else
            git tag -a "$tag" -m "wreath v$VERSION"
            git push origin "refs/tags/$tag"
          fi

      - name: Create GitHub release
        env:
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it alone."
            exit 0
          fi
          # No --target. It sets `target_commitish`, which GitHub defines as a
          # BRANCH or COMMIT SHA to create the tag from -- passing the tag name
          # is rejected outright ("release.target_commitish is invalid"), and it
          # is unused anyway once the tag exists, which the previous step
          # guarantees. --verify-tag makes that guarantee explicit: fail if the
          # tag is somehow absent rather than silently creating a second one.
          args=(--title "$tag" --notes-file "docs/release_notes/$VERSION.md" --verify-tag)
          if [ "${PRERELEASE:-false}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" "${args[@]}"

  pypi-linux:
    needs: [detect, verify, wheels, linux-wheels, http3-wheels, release]
    # Explicit, though a skipped `release` would skip this anyway: without it,
    # adding any future `if:` to `release` silently changes what publishes.
    # `verify` is named here as well as on `release` for the same reason.
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish-linux
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no stored token needed
    steps:
      - name: Collect the Linux companion wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-linux-*
          path: dist
          merge-multiple: true
      - name: Show what will be published
        run: ls -l dist
      - name: Publish wreath-linux to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  pypi-http3:
    needs: [detect, verify, wheels, linux-wheels, http3-wheels, release]
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish-http3
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no stored token needed
    steps:
      - name: Collect the HTTP/3 companion wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-http3-*
          path: dist
          merge-multiple: true
      - name: Show what will be published
        run: ls -l dist
      - name: Publish wreath-http3 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  pypi:
    needs: [detect, verify, wheels, linux-wheels, http3-wheels, release, pypi-linux, pypi-http3]
    # Publish the public base project last: `uv add wreath[linux]` and
    # `uv add wreath[h3]` cannot observe a base release whose exact-version
    # companions have not reached the index yet.
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no stored token needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - name: Collect the portable wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-base-*
          path: dist
          merge-multiple: true
      - name: Show what will be published
        # The upload is irreversible -- PyPI does not accept a re-upload of a
        # version -- so the manifest goes in the log before it happens.
        run: ls -l dist
      - name: Publish wreath to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
