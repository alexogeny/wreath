name: publish

# Cut a versioned release from the exact main commit that passed `ci`.
#
#   1. detect  - Is the pyproject version a valid PEP 440 version and newer than
#                the last version tag?
#                Emits `bumped`, `version`, and the validated commit SHA. The
#                last PEP 440 tag is the baseline, so a follow-up fix can resume
#                an unpublished version without touching pyproject.toml again.
#
#                When no release is cut, the reason is written to the run
#                summary. A skipped `release` job otherwise looks identical to
#                a broken one.
#                `workflow_run.head_sha`, rather than the default-branch SHA of
#                this second workflow, is checked out by every source-consuming
#                job. The event is accepted only from this repository's
#                successful push run on main.
#   2. release - (environment: publish) Guard against a duplicate tag, require a
#                version, then cut the
#                `release/vX.Y.Z` branch from the release commit, push the
#                `vX.Y.Z` tag, and create the GitHub Release with generated notes.
#   3. wheels  - Build and smoke-test the portable wheel on native Linux,
#                macOS and Windows runners. Then build the Linux io_uring and
#                HTTP/3 companion wheels selected by extras. `release` needs all
#                three jobs: a wheel that will not run must stop the tag, not
#                leave one pointing at a release nobody can install.
#   4. pypi-*  - Publish one distribution per Trusted Publishing identity. The
#                companion projects go first; the base project becomes visible
#                only after both extras are installable.
#
# Configure all three GitHub environments with the same reviewer/branch policy,
# then register these exact PyPI Trusted Publishers (owner `alexogeny`, repository
# `wreath`, workflow `publish.yml`):
#
#   wreath        -> environment `publish`
#   wreath-linux  -> environment `publish-linux`
#   wreath-http3  -> environment `publish-http3`
#
# The distinct environments are required while the companion projects are
# pending. PyPI refuses a second pending project with the same owner/repository/
# workflow/environment identity because an incoming OIDC token would not name
# which pending project it is meant to create.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release even if no version bump is detected
        type: boolean
        default: false

# Read-only by default; the jobs that need to write request it explicitly.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On workflow_run, github.sha is the tip of the default branch when
          # this workflow starts, which may already be newer than the commit CI
          # tested. Pin the triggering run's immutable SHA instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the version parser
        # `packaging` is the reference PEP 440 implementation. This check used a
        # semver regex and `sort -V`, and the index this guards speaks neither:
        # `0.1.0a1` is a legal Python version the regex rejected outright, and
        # `sort -V` orders `0.1.0 < 0.1.0-alpha` where PEP 440 -- and PyPI --
        # order it the other way. Both errors point at publishing the wrong
        # thing, so the guard now uses the same rules as the index.
        run: python -m pip install --quiet packaging
      - id: check
        env:
          FORCED: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extract() { grep -m1 -E '^version[[:space:]]*=' \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'; }

          version="$(extract < pyproject.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Emitted here because this is the only job with `packaging`, and a
          # GitHub release that does not say it is a prerelease takes the
          # "Latest release" badge from whatever stable version preceded it.
          prerelease="$(python -c '
          import sys
          from packaging.version import InvalidVersion, Version
          try:
              print(str(Version(sys.argv[1]).is_prerelease).lower())
          except InvalidVersion:
              print("false")
          ' "$version")"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          if ! python -c '
          import sys
          from packaging.version import InvalidVersion, Version
          try:
              Version(sys.argv[1])
          except InvalidVersion as error:
              sys.exit(str(error))
          ' "$version"; then
            echo "::error::version '$version' is not a valid PEP 440 version"
            exit 1
          fi

          note() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          if [ "${FORCED:-false}" = "true" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            note "Forced release of **$version** (no version diff required)."
            exit 0
          fi

          # Tags are the durable publication baseline. Unlike comparing with a
          # push's `before` commit, this also sees an unchanged version after a
          # compiler-fix commit. Select with `packaging`, not git's version sort,
          # because the tag namespace follows PEP 440 rather than semver.
          latest_tag="$(git tag --list 'v*' | python -c '
          import sys
          from packaging.version import InvalidVersion, Version
          parsed = []
          for raw_tag in sys.stdin:
              tag = raw_tag.strip()
              try:
                  parsed.append((Version(tag.removeprefix("v")), tag))
              except InvalidVersion:
                  pass
          print(max(parsed, default=(None, ""), key=lambda item: item[0])[1])
          ')"

          if [ -z "$latest_tag" ]; then
            note "No \`v*\` tag exists, so **$version** is the first release."
          else
            latest="${latest_tag#v}"
            comparison="$(python -c '
            import sys
            from packaging.version import Version
            current, latest = map(Version, sys.argv[1:])
            print((current > latest) - (current < latest))
            ' "$version" "$latest")"
            if [ "$comparison" -lt 0 ]; then
              echo "::error::version '$version' is older than latest tag '$latest_tag'"
              exit 1
            fi
            if [ "$comparison" -eq 0 ] && gh release view "$latest_tag" >/dev/null 2>&1; then
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              note "### No release cut"
              note ""
              note "**$version** is already published as \`$latest_tag\`; release jobs were skipped."
              exit 0
            fi
            if [ "$comparison" -eq 0 ]; then
              note "\`$latest_tag\` exists without a GitHub Release; resuming **$version** at this CI-tested commit."
            fi
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          note "**$version** is not published. Cutting a release from \`$(git rev-parse --short HEAD)\`."

  wheels:
    # The base distribution is the portable native implementation. Each wheel
    # is compiled and served on the target OS before the release tag exists.
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    strategy:
      # Finish every target so one compiler failure does not erase the evidence
      # from runners that were already building.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: windows-2025
            platform: windows
            arch: AMD64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
      # Everything else -- interpreter, image, skips, and the import smoke test
      # each wheel must pass -- is `[tool.cibuildwheel]` in pyproject.toml, so it
      # is the same locally as it is here.
      - uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-base-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  linux-wheels:
    # `wreath[linux]`: only the io_uring extension. It overlays the installed
    # base wheel's `wreath._native` directory; the smoke test proves the two
    # separately built distributions import and serve together.
    needs: [detect, wheels]
    if: needs.detect.outputs.bumped == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-base-linux-${{ matrix.arch }}
          path: wheel-deps
      - name: Stage a self-contained companion build
        run: >-
          python tools/stage_companion_wheel.py linux
          packages/.wheel-staging/wreath-linux-wheel
      - uses: pypa/cibuildwheel@v3.2.0
        with:
          package-dir: packages/.wheel-staging/wreath-linux-wheel
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  http3-wheels:
    # `wreath[h3]` / `wreath[http3]`. The pinned MIT/Apache-licensed QUIC/TLS
    # stack is built inside manylinux and bundled by auditwheel, so opting in
    # does not require system packages on the deployment host.
    needs: [detect, wheels]
    if: needs.detect.outputs.bumped == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-base-linux-${{ matrix.arch }}
          path: wheel-deps
      - name: Stage a self-contained companion build
        run: >-
          python tools/stage_companion_wheel.py http3
          packages/.wheel-staging/wreath-http3-wheel
      - uses: pypa/cibuildwheel@v3.2.0
        with:
          package-dir: packages/.wheel-staging/wreath-http3-wheel
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-http3-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    needs: [detect, wheels, linux-wheels, http3-wheels]
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write # push the release branch/tag and create the release
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      RELEASE_SHA: ${{ needs.detect.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0 # full history so the tag and branch are complete

      - name: Guard against a tag that means something else
        run: |
          set -euo pipefail
          # A tag at a DIFFERENT commit means the version was reused, which is
          # what this guard is for. A tag at THIS commit means an earlier run of
          # this same release got partway and failed -- refusing that leaves the
          # release permanently unfinishable, because the tag it already pushed
          # is what blocks the retry. Ask for a re-run, not a version bump.
          tag="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            exit 0
          fi
          existing="$(git rev-list -n1 "$tag")"
          if [ "$existing" = "$RELEASE_SHA" ]; then
            echo "Tag $tag already at this commit; resuming a partial release."
            exit 0
          fi
          # The tag names a different commit. Whether that is a reused version or
          # an unfinished attempt is decided by whether anything ever consumed
          # it: `pypi` runs only after this job succeeds, so no GitHub Release
          # means nothing was published either.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already released, at $existing; bump the version"
            exit 1
          fi
          # Nothing consumed it, so the tag is a leftover from a run that failed
          # after pushing it -- which is exactly what happens when the failure is
          # in CI and the fix is another commit. Moving it is correct: the wheels
          # were built from this workflow's exact SHA, so a tag left behind would
          # name a tree the published artifacts do not match.
          echo "::warning::$tag exists at $existing but was never released; moving it to $RELEASE_SHA"
          echo "RETAG=1" >> "$GITHUB_ENV"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release branch and tag
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          tag="v$VERSION"
          # --force on the branch and a skip on the tag: re-running must reach
          # the same end state rather than failing on what the last run already
          # did. checkout fetches tags at depth 0, so a tag present locally is a
          # tag present on the remote.
          git branch -f "$branch" HEAD
          git push --force origin "$branch"
          if [ "${RETAG:-0}" = "1" ]; then
            git tag -f -a "$tag" -m "wreath v$VERSION"
            git push --force origin "refs/tags/$tag"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already pushed at this commit; leaving it."
          else
            git tag -a "$tag" -m "wreath v$VERSION"
            git push origin "refs/tags/$tag"
          fi

      - name: Create GitHub release
        env:
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it alone."
            exit 0
          fi
          # No --target. It sets `target_commitish`, which GitHub defines as a
          # BRANCH or COMMIT SHA to create the tag from -- passing the tag name
          # is rejected outright ("release.target_commitish is invalid"), and it
          # is unused anyway once the tag exists, which the previous step
          # guarantees. --verify-tag makes that guarantee explicit: fail if the
          # tag is somehow absent rather than silently creating a second one.
          args=(--title "$tag" --generate-notes --verify-tag)
          if [ "${PRERELEASE:-false}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" "${args[@]}"

  pypi-linux:
    needs: [detect, wheels, linux-wheels, http3-wheels, release]
    # Explicit, though a skipped `release` would skip this anyway: without it,
    # adding any future `if:` to `release` silently changes what publishes.
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish-linux
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no stored token needed
    steps:
      - name: Collect the Linux companion wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-linux-*
          path: dist
          merge-multiple: true
      - name: Show what will be published
        run: ls -l dist
      - name: Publish wreath-linux to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  pypi-http3:
    needs: [detect, wheels, linux-wheels, http3-wheels, release]
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish-http3
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no stored token needed
    steps:
      - name: Collect the HTTP/3 companion wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-http3-*
          path: dist
          merge-multiple: true
      - name: Show what will be published
        run: ls -l dist
      - name: Publish wreath-http3 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  pypi:
    needs: [detect, wheels, linux-wheels, http3-wheels, release, pypi-linux, pypi-http3]
    # Publish the public base project last: `uv add wreath[linux]` and
    # `uv add wreath[h3]` cannot observe a base release whose exact-version
    # companions have not reached the index yet.
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no stored token needed
    steps:
      - name: Collect the portable wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-base-*
          path: dist
          merge-multiple: true
      - name: Show what will be published
        # The upload is irreversible -- PyPI does not accept a re-upload of a
        # version -- so the manifest goes in the log before it happens.
        run: ls -l dist
      - name: Publish wreath to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
