name: publish

# Cut a versioned release when a commit on main bumps the version in
# pyproject.toml.
#
#   1. detect  - Is the pyproject version a valid PEP 440 version, greater than
#                the last published one, and does it have release notes?
#                Emits `bumped` + `version`.
#
#                The baseline is `github.event.before`, not `HEAD~1`. A push
#                carrying several commits that bumps the version in any but the
#                last leaves HEAD~1 already holding the new version, so the diff
#                is empty and no release is cut -- with a green tick, because
#                "no bump" is a success.
#
#                When no release is cut, the reason is written to the run
#                summary. A skipped `release` job otherwise looks identical to
#                a broken one.
#   2. release - (environment: publish) Guard against a duplicate tag, require a
#                docs/release_notes/<version>.md file, then cut the
#                `release/vX.Y.Z` branch from the release commit, push the
#                `vX.Y.Z` tag, and create the GitHub Release from the notes.
#   3. pypi    - (environment: publish) Build the sdist and publish to PyPI via
#                Trusted Publishing (OIDC, no stored token).
#
# The `publish` environment gates steps 2 and 3: configure it in the repo
# settings with whatever reviewers/branch restrictions you want, and register a
# matching PyPI Trusted Publisher (environment name `publish`).

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:
    inputs:
      force:
        description: Release even if no version bump is detected
        type: boolean
        default: false

# Read-only by default; the jobs that need to write request it explicitly.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not `2`. The baseline is the commit this push STARTED
          # from (`github.event.before`), which can be many commits back, and a
          # shallow clone cannot read pyproject.toml out of it.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the version parser
        # `packaging` is the reference PEP 440 implementation. This check used a
        # semver regex and `sort -V`, and the index this guards speaks neither:
        # `0.1.0a1` is a legal Python version the regex rejected outright, and
        # `sort -V` orders `0.1.0 < 0.1.0-alpha` where PEP 440 -- and PyPI --
        # order it the other way. Both errors point at publishing the wrong
        # thing, so the guard now uses the same rules as the index.
        run: python -m pip install --quiet packaging
      - id: check
        env:
          FORCED: ${{ inputs.force }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Reads stdin, so the same helper works on a file and on `git show`.
          extract() { grep -m1 -E '^version[[:space:]]*=' \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'; }

          version="$(extract < pyproject.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Emitted here because this is the only job with `packaging`, and a
          # GitHub release that does not say it is a prerelease takes the
          # "Latest release" badge from whatever stable version preceded it.
          prerelease="$(python -c '
          import sys
          from packaging.version import InvalidVersion, Version
          try:
              print(str(Version(sys.argv[1]).is_prerelease).lower())
          except InvalidVersion:
              print("false")
          ' "$version")"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          if ! python -c '
          import sys
          from packaging.version import InvalidVersion, Version
          try:
              Version(sys.argv[1])
          except InvalidVersion as error:
              sys.exit(str(error))
          ' "$version"; then
            echo "::error::version '$version' is not a valid PEP 440 version"
            exit 1
          fi

          # The baseline must be where the push started, NOT HEAD~1. A push of
          # several commits that bumps the version in any but the last leaves
          # HEAD~1 already carrying the new version, so the diff comes out empty
          # and the release never happens -- silently, because "no bump" is a
          # success.
          #
          # `before` is all-zeros when the branch is newly created, and absent
          # entirely on workflow_dispatch. Both fall back to HEAD~1, which is
          # deliberately the conservative reading: treating "no previous state"
          # as a bump would cut a release the first time main is ever pushed.
          zero="0000000000000000000000000000000000000000"
          base=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif git cat-file -e 'HEAD~1^{commit}' 2>/dev/null; then
            base="HEAD~1"   # workflow_dispatch carries no `before`
          fi
          prev=""
          if [ -n "$base" ]; then
            prev="$(git show "$base:pyproject.toml" 2>/dev/null | extract || true)"
          fi

          note() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          if [ "${FORCED:-false}" = "true" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            note "Forced release of **$version** (no version diff required)."
            exit 0
          fi

          if [ "$version" = "$prev" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            # Say so loudly. A skipped `release` under a green tick is
            # indistinguishable from a broken one without reading the log, and
            # that ambiguity has already cost one round of investigation.
            note "### No release cut"
            note ""
            note "\`pyproject.toml\` is still at **$version**, unchanged since \`${base:-<none>}\`,"
            note "so \`release\` and \`pypi\` were skipped. **This is the designed outcome, not a"
            note "failure.** Bump the version (and add its release notes) to cut a release."
            exit 0
          fi

          # Compare against the last *published* version, not against whatever
          # pyproject said a commit ago. Those differ exactly once, and it is
          # now: pyproject carried `0.1.0` from the first commit without a
          # release ever being cut, so the first prerelease of it -- `0.1.0a1`,
          # which PEP 440 correctly orders BELOW `0.1.0` -- would be rejected as
          # a downgrade from a version nobody can install. You cannot go
          # backwards from something that was never published.
          released="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          if [ -z "$released" ]; then
            note "No \`v*\` tag exists, so **$version** is the first release; the"
            note "increase check is skipped (no published version to regress from)."
          elif ! python -c '
          import sys
          from packaging.version import Version
          sys.exit(0 if Version(sys.argv[2]) > Version(sys.argv[1]) else 1)
          ' "$released" "$version"; then
            echo "::error::version '$version' does not increase last released '$released'"
            exit 1
          fi

          # Checked here as well as in `release`, because `release` sits behind
          # the `publish` environment: leaving this as the only check means a
          # missing notes file is reported only after whatever approval that
          # gate requires, which is the slowest possible moment to learn it.
          notes="docs/release_notes/$version.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes -- run the release-notes skill before bumping the version"
            exit 1
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          note "Version bump: **${prev:-<none>} -> $version**. Cutting a release."

  release:
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write # push the release branch/tag and create the release
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the tag and branch are complete

      - name: Guard against a tag that means something else
        run: |
          set -euo pipefail
          # A tag at a DIFFERENT commit means the version was reused, which is
          # what this guard is for. A tag at THIS commit means an earlier run of
          # this same release got partway and failed -- refusing that leaves the
          # release permanently unfinishable, because the tag it already pushed
          # is what blocks the retry. Ask for a re-run, not a version bump.
          tag="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            exit 0
          fi
          existing="$(git rev-list -n1 "$tag")"
          if [ "$existing" = "$GITHUB_SHA" ]; then
            echo "Tag $tag already at this commit; resuming a partial release."
            exit 0
          fi
          # The tag names a different commit. Whether that is a reused version or
          # an unfinished attempt is decided by whether anything ever consumed
          # it: `pypi` runs only after this job succeeds, so no GitHub Release
          # means nothing was published either.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already released, at $existing; bump the version"
            exit 1
          fi
          # Nothing consumed it, so the tag is a leftover from a run that failed
          # after pushing it -- which is exactly what happens when the failure is
          # in CI and the fix is another commit. Moving it is correct: the sdist
          # is built from HEAD, so a tag left behind would name a tree the
          # published artifact does not match.
          echo "::warning::$tag exists at $existing but was never released; moving it to $GITHUB_SHA"
          echo "RETAG=1" >> "$GITHUB_ENV"

      - name: Require release notes
        run: |
          set -euo pipefail
          notes="docs/release_notes/$VERSION.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes — run the release-notes skill to generate it before bumping the version"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release branch and tag
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          tag="v$VERSION"
          # --force on the branch and a skip on the tag: re-running must reach
          # the same end state rather than failing on what the last run already
          # did. checkout fetches tags at depth 0, so a tag present locally is a
          # tag present on the remote.
          git branch -f "$branch" HEAD
          git push --force origin "$branch"
          if [ "${RETAG:-0}" = "1" ]; then
            git tag -f -a "$tag" -m "wreath v$VERSION"
            git push --force origin "refs/tags/$tag"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already pushed at this commit; leaving it."
          else
            git tag -a "$tag" -m "wreath v$VERSION"
            git push origin "refs/tags/$tag"
          fi

      - name: Create GitHub release
        env:
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it alone."
            exit 0
          fi
          # No --target. It sets `target_commitish`, which GitHub defines as a
          # BRANCH or COMMIT SHA to create the tag from -- passing the tag name
          # is rejected outright ("release.target_commitish is invalid"), and it
          # is unused anyway once the tag exists, which the previous step
          # guarantees. --verify-tag makes that guarantee explicit: fail if the
          # tag is somehow absent rather than silently creating a second one.
          args=(--title "$tag" --notes-file "docs/release_notes/$VERSION.md" --verify-tag)
          if [ "${PRERELEASE:-false}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" "${args[@]}"

  pypi:
    needs: [detect, release]
    # Explicit, though a skipped `release` would skip this anyway: without it,
    # adding any future `if:` to `release` silently changes what publishes.
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no stored token needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
          # Binary wheels for the native extension are a follow-up: they need
          # cibuildwheel plus the vendored nghttp3/ngtcp2 toolchain. Until then
          # PyPI ships the sdist and installers compile the C extension locally.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
